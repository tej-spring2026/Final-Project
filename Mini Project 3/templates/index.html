{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">

    <div class="text-center mb-4 mt-2">
      <h1 class="h3 fw-bold">Can I make it?</h1>
      <p class="text-muted">Enter your start and end, tell us when you need to arrive,
        and we'll tell you exactly when to leave.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form action="/plan" method="POST">

          <div class="mb-3">
            <label for="origin" class="form-label fw-semibold">From</label>
            <input
              type="text"
              class="form-control"
              id="origin"
              name="origin"
              placeholder="e.g. South Station, Boston"
              autocomplete="off"
              required>
          </div>

          <div class="mb-3">
            <label for="destination" class="form-label fw-semibold">To</label>
            <input
              type="text"
              class="form-control"
              id="destination"
              name="destination"
              placeholder="e.g. Harvard Square, Cambridge"
              autocomplete="off"
              required>
          </div>

          <div class="mb-4">
            <label for="arrival_time" class="form-label fw-semibold">Need to arrive by</label>
            <input
              type="time"
              class="form-control"
              id="arrival_time"
              name="arrival_time"
              required>
          </div>

          <button type="submit" class="btn btn-dark w-100 fw-semibold">
            Can I make it? &rarr;
          </button>

        </form>
      </div>
    </div>

    <p class="text-muted text-center small mt-3">
      Subway only &mdash; Red, Orange, Blue, and Green Lines.
      Boston area addresses only.
    </p>

  </div>
</div>
{% endblock %}
